services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: brick_orders
      POSTGRES_USER: brick_app
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-brick_local}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brick_app -d brick_orders"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/brick_orders
      DATABASE_USERNAME: brick_app
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-brick_local}
      SERVER_ADDRESS: 0.0.0.0
      SPRING_SECURITY_USER_NAME: ${APP_USER:-admin}
      SPRING_SECURITY_USER_PASSWORD: ${APP_PASSWORD:-local-only-change-me}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
